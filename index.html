<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hop’s Math Pond</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#c9f0f7;--bg2:#8fd3e3;--card:#fffdf4;--ink:#17375e;--btn:#ffffff;--accent:#ff7a59;--sun:#ffc93c;--leaf:#3fb55f;--bad:#ef6a6a;--shade:rgba(23,55,94,.22);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg1:#12304f;--bg2:#0d2340;--card:#1d4068;--ink:#f3f8ff;--btn:#26507f;--shade:rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg1:#12304f;--bg2:#0d2340;--card:#1d4068;--ink:#f3f8ff;--btn:#26507f;--shade:rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Fredoka','Trebuchet MS','Comic Sans MS',sans-serif;color:var(--ink);background:linear-gradient(var(--bg1),var(--bg2)) fixed;background-color:var(--bg2);-webkit-tap-highlight-color:transparent}
main{max-width:600px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
.card{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 6px 0 var(--shade)}
h1{font-size:2.3rem;margin:0;line-height:1.05;font-weight:700}
h2{margin:0;font-size:1.5rem}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:var(--sun);color:#17375e;border-radius:999px;padding:6px 14px;font-weight:700;font-size:1.1rem}
.icon{background:var(--btn);color:var(--ink);border:0;border-radius:50%;width:48px;height:48px;font-size:1.4rem;box-shadow:0 4px 0 var(--shade);cursor:pointer}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.hero{text-align:center}
.frog{font-size:5.5rem;display:inline-block;line-height:1}
.hop{animation:hop .7s ease-out}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-34px) rotate(-8deg)}70%{transform:translateY(0) rotate(6deg)}100%{transform:none}}
.menu{display:grid;gap:12px}
.mode{display:flex;align-items:center;gap:14px;text-align:left;font-size:1.35rem;font-weight:700;color:#17375e;border:0;border-radius:24px;padding:14px 18px;box-shadow:0 6px 0 var(--shade);transition:transform .08s}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shade)}
.mode small{display:block;font-weight:400;font-size:.95rem;opacity:.8}
.mode .e{font-size:2.4rem}
.pads{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pad{width:24px;height:16px;border-radius:50%;background:var(--shade)}
.pad.done{background:var(--leaf)}
.pad.now{background:var(--sun);transform:scale(1.25)}
.q{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.prompt{font-size:1.6rem;font-weight:700}
.stuff{font-size:2.1rem;line-height:1.25;letter-spacing:2px;word-break:break-word}
.stuff .gone{opacity:.25;filter:grayscale(1)}
.eq{font-size:3.2rem;font-weight:700;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.blank{display:inline-block;min-width:1.6em;border-bottom:6px dashed var(--accent);color:var(--accent)}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ans{font-size:2.6rem;font-weight:700;color:var(--ink);background:var(--btn);border:4px solid transparent;border-radius:24px;padding:16px 0;box-shadow:0 6px 0 var(--shade)}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shade)}
.ans.ok{background:var(--leaf);color:#fff}
.ans.no{background:var(--bad);color:#fff;animation:shake .4s}
.ans:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.say{min-height:2.2em;text-align:center;font-size:1.25rem;font-weight:600}
.big{font-size:1.4rem;font-weight:700;border:0;border-radius:999px;padding:14px 28px;background:var(--accent);color:#fff;box-shadow:0 6px 0 var(--shade)}
.big.alt{background:var(--btn);color:var(--ink)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stars{font-size:3.6rem;letter-spacing:6px}
.fall{position:fixed;top:-40px;font-size:2rem;pointer-events:none;animation:fall 1.8s ease-in forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.hop,.ans.no,.fall{animation:none}.fall{display:none}}
@media (max-width:420px){.ans{font-size:2.1rem}.eq{font-size:2.6rem}}

.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;margin:6px 0}
.chip{background:var(--btn);border-radius:12px;padding:6px 12px;font-weight:700;font-size:1.3rem;box-shadow:0 3px 0 var(--shade)}
.chip.hi{background:var(--sun);color:#17375e}
.chips b{opacity:.6}
.nb{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.nb i{font-style:normal;font-size:.9rem;font-weight:700;background:var(--sun);color:#17375e;border-radius:8px;padding:0 6px;margin-top:2px}
.bar{background:var(--shade);border-radius:12px;margin:8px 0;overflow:hidden;text-align:left}
.bar i{display:block;background:var(--leaf);color:#fff;font-style:normal;font-weight:700;font-size:1.4rem;padding:6px 12px;border-radius:12px;min-width:3.2em}
.lesson{text-align:center;display:flex;flex-direction:column;gap:10px;border:4px solid var(--sun)}
.lesson p{font-size:1.2rem;font-weight:600}
.pad.bad{background:var(--bad)}
.big.sm{font-size:1rem;padding:8px 16px}
.stat{display:flex;gap:10px;text-align:center}
.stat div{background:var(--btn);border-radius:20px;padding:10px 8px;font-size:1rem;font-weight:600;flex:1}
.stat b{display:block;font-size:1.8rem}
.trow{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px;align-items:center;margin:8px 0;font-weight:600;font-size:.95rem}
.tb{background:var(--shade);border-radius:99px;height:12px;overflow:hidden;display:block}.tb i{display:block;height:100%}
.rep p{margin:6px 0}.rep ul{margin:6px 0;padding-left:20px}

.arr{display:grid;gap:3px;margin:8px auto;width:min(100%,calc(var(--c)*26px))}
.arr i{aspect-ratio:1;background:var(--leaf);border-radius:50%}
.arr.sq i{border-radius:3px;background:var(--accent)}
.fb{display:flex;gap:3px;max-width:320px;margin:8px auto}
.fb span{flex:1;height:34px;border-radius:6px;background:var(--shade)}
.fb span.on{background:var(--accent)}
.stack{font-family:ui-monospace,Menlo,monospace;font-size:1.5rem;font-weight:700;text-align:left;display:inline-block;margin:6px auto;white-space:pre}
.cnt{background:var(--sun);color:#17375e;border-radius:10px;padding:0 8px;font-size:1.3rem}
.sel{width:100%;font-family:inherit;font-size:1.1rem;padding:10px;border-radius:14px;border:3px solid var(--shade);background:var(--btn);color:var(--ink)}

main{gap:10px;padding:12px}
.q{gap:8px}.card.q{padding:12px}
.q .frog{font-size:2.4rem}
.q .prompt{font-size:1.3rem}
.q .stuff{font-size:min(1.9rem,7vw);letter-spacing:0}
.q .eq{font-size:min(2.6rem,9.5vw)!important}
.q svg{height:min(22vh,180px);width:auto;max-width:100%}
.q svg.wide{height:auto;width:100%;max-width:340px}
.ans{font-size:2.2rem;padding:12px 2px;overflow-wrap:anywhere}
.answers{gap:10px}
.padov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(var(--bg1),var(--bg2));background-color:var(--bg2);font-family:'Fredoka','Trebuchet MS',sans-serif;color:var(--ink)}
.padtop{text-align:center;max-height:30vh;overflow:auto}
.padtop b{font-size:1.2rem;display:block}
.padtop svg{height:min(14vh,110px)!important;width:auto}
.padtop .eq{font-size:min(2rem,8vw)!important}
.padtop .stuff{font-size:1.3rem}
.padov canvas{flex:1;min-height:0;width:100%;border-radius:18px;border:3px dashed var(--shade);background-color:#fff;background-image:linear-gradient(#e3edf7 1px,transparent 1px),linear-gradient(90deg,#e3edf7 1px,transparent 1px);background-size:24px 24px}
.padtools{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:4px solid var(--card);box-shadow:0 3px 0 var(--shade)}
.sw.on,.tl.on{outline:4px solid var(--sun)}
.tl{width:46px;height:46px;border-radius:50%;border:0;font-size:1.4rem;background:var(--btn);box-shadow:0 3px 0 var(--shade)}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
var app=document.getElementById('app');
var MODES=[
 {id:'count',e:'🔢',name:'Count it',desc:'How many do you see?',c:'#ffd96b'},
 {id:'add',e:'➕',name:'Put together',desc:'Add numbers up',c:'#9fe3a6'},
 {id:'sub',e:'➖',name:'Take away',desc:'How many are left?',c:'#ffb3a1'},
 {id:'cmp',e:'⚖️',name:'Bigger or smaller',desc:'Pick the right number',c:'#c4b5f5'},
 {id:'next',e:'🪜',name:'What comes next?',desc:'Fill in the missing number',c:'#9fd8f5'},
 {id:'tens',e:'🔟',name:'Tens and ones',desc:'Build numbers up to 99',c:'#ffd0e8'},
 {id:'miss',e:'❓',name:'Missing number',desc:'3 + ? = 8',c:'#ffe0a3'},
 {id:'word',e:'📖',name:'Story problems',desc:'Listen and solve',c:'#b8f0d8'},
 {id:'time',e:'🕒',name:'Tell time',desc:'Hours and half hours',c:'#f5c6c6'},
 {id:'mult',e:'✖️',name:'Multiply',desc:'Groups, arrays, big products',c:'#ffd96b'},
 {id:'div',e:'➗',name:'Divide',desc:'Share equally',c:'#9fe3a6'},
 {id:'frac',e:'🍕',name:'Fractions',desc:'Parts of a whole',c:'#ffb3a1'},
 {id:'dec',e:'🔢',name:'Decimals',desc:'Tenths and hundredths',c:'#c4b5f5'},
 {id:'round',e:'🎯',name:'Rounding',desc:'Nearest ten, hundred, more',c:'#9fd8f5'},
 {id:'area',e:'📐',name:'Area, perimeter, volume',desc:'Measure shapes',c:'#ffd0e8'},
 {id:'ops',e:'🧮',name:'Order of operations',desc:'Do the steps in order',c:'#ffe0a3'},
 {id:'shapes',e:'🔷',name:'Shapes',desc:'Name and count sides',c:'#c4b5f5'},
 {id:'length',e:'📏',name:'Measure length',desc:'Use a ruler',c:'#9fe3a6'},
 {id:'data',e:'📊',name:'Graphs',desc:'Read picture graphs',c:'#ffd96b'}
];
var ITEMS=['🍎','⭐','🐞','🐟','🍪','🎈','🦋','🍓'];
var total=0, muted=false, ctx=null, LV=1, lvls={};
try{lvls=JSON.parse(localStorage.getItem('hop-lv')||'{}')||{};}catch(e){lvls={};}
try{total=parseInt(localStorage.getItem('hop-stars')||'0',10)||0;}catch(e){}
function save(){try{localStorage.setItem('hop-stars',String(total));}catch(e){}}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(a){return a[rnd(0,a.length-1)];}
function beep(freqs,type){
 if(muted)return;
 try{
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  freqs.forEach(function(f,i){
   var o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*0.12;
   o.type=type||'sine';o.frequency.value=f;
   g.gain.setValueAtTime(0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
   o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.22);
  });
 }catch(e){}
}
var voiceKind='teacher';
try{voiceKind=localStorage.getItem('hop-voice')||'teacher';}catch(e){}
function findVoice(){
 try{
  var vs=window.speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang);});
  var f=vs.filter(function(v){return /samantha|zira|jenny|aria|susan|karen|moira|tessa|victoria|fiona|serena|female|google us english|google uk english female/i.test(v.name);});
  var pn=null;try{pn=localStorage.getItem('hop-vname');}catch(e){}
  var pv=pn&&vs.filter(function(v){return v.name===pn;})[0];
  return pv||f[0]||vs[0]||null;
 }catch(e){return null;}
}
try{window.speechSynthesis.getVoices();}catch(e){}
function speak(t){
 if(muted)return;
 try{
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t),v=findVoice();
  if(v)u.voice=v;
  if(voiceKind==='child'){u.rate=1.0;u.pitch=1.9;}
  else{u.rate=0.85;u.pitch=1.0;}
  var sp=1;try{sp=parseFloat(localStorage.getItem('hop-speed'))||1;}catch(e){}
  u.rate*=sp;
  window.speechSynthesis.speak(u);
 }catch(e){}
}
function confetti(){
 var s=['🎉','⭐','✨','🌟','🐸'];
 for(var i=0;i<14;i++){
  var d=document.createElement('div');d.className='fall';d.textContent=pick(s);
  d.style.left=rnd(2,92)+'vw';d.style.animationDelay=(Math.random()*.5)+'s';
  document.body.appendChild(d);
  setTimeout(function(n){n.remove();}.bind(null,d),2600);
 }
}
function items(n,goneCount){
 var e=pick(ITEMS),h='';
 for(var i=0;i<n;i++)h+='<span'+(goneCount&&i>=n-goneCount?' class="gone"':'')+'>'+e+'</span>';
 return h;
}
function opts(ans,max){
 var s={};s[ans]=1;
 var guard=0;
 while(Object.keys(s).length<3&&guard++<60){
  var v=ans+rnd(-3,3);
  if(v>=0&&v<=max&&v!==ans)s[v]=1;
 }
 return Object.keys(s).map(Number).sort(function(){return Math.random()-.5;});
}
var GN=['Kindergarten','1st grade','2nd grade','3rd grade','4th grade','5th grade'];
var GM={count:[0,1],add:[0,1,2,3,4],sub:[0,1,2,3,4],cmp:[0,1,2,3,4,5],next:[0,1,2],tens:[1,2,3,4,5],miss:[1,2],word:[0,1,2,3,4,5],time:[1,2,3],mult:[3,4,5],div:[3,4,5],frac:[3,4,5],dec:[4,5],round:[3,4,5],area:[3,4,5],ops:[5],shapes:[0,1,2],length:[0,1,2],data:[0,1,2]};
var TIPS={count:'Have your child touch each item and count out loud, moving counted items to one side.',add:'Practice counting on: start at the bigger number and count up. Use fingers, toys, or a number line.',sub:'Try counting back, or use objects: start with the total, take some away, and count what is left.',cmp:'Line up two groups of objects to see which has more. For bigger numbers, compare the left digit first.',next:'Say number patterns out loud together, like 5, 10, 15. A hundreds chart helps.',tens:'Use dimes (tens) and pennies (ones), or blocks, to build numbers.',miss:'Ask: what do I add to get there? Count up from the small number to the total.',word:'Read the story together, circle the numbers, and ask: are we joining or taking away?',time:'Use an analog clock at home. Short hand is the hour, long hand is the minutes (each number is 5).'};
var GR=1,hasGrade=false,due=false;
try{var _g=localStorage.getItem('hop-grade');if(_g!==null){GR=parseInt(_g,10)||0;hasGrade=true;}}catch(e){}
var ST={r:0,w:0,m:{},miss:[]};
try{var _s=JSON.parse(localStorage.getItem('hop-stats')||'null');if(_s&&_s.m)ST=_s;}catch(e){}
function saveST(){try{localStorage.setItem('hop-stats',JSON.stringify(ST));}catch(e){}}
function say2(t){speak(String(t).replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF\uFE0F]/gu,''));}
function near(ans,list,max,min){min=min||0;var s={};s[ans]=1;list.forEach(function(v){if(v>=min&&v<=max&&Object.keys(s).length<3)s[v]=1;});var g=0;while(Object.keys(s).length<3&&g++<80){var v=ans+rnd(-3,3);if(v>=min&&v<=max)s[v]=1;}return Object.keys(s).map(Number).sort(function(){return Math.random()-.5;});}
function chips(arr,hi){return "<div class='chips'>"+arr.map(function(v,i){return "<span class='chip"+(hi&&hi.indexOf(i)>-1?" hi":"")+"'>"+v+"</span>";}).join('<b>›</b>')+"</div>";}
function hops(a,n,d){var r=[a];for(var i=1;i<=n;i++)r.push(a+d*i);return chips(r,[0,n]);}
function eqv(parts){return "<div class='eq'>"+parts.map(function(p){return p==='?'?"<span class='blank'>?</span>":'<span>'+p+'</span>';}).join('')+'</div>';}
function clock(h,m){
 var s="<svg viewBox='-60 -60 120 120' width='190' height='190' role='img' aria-label='Clock'><circle r='56' fill='#fff' stroke='#17375e' stroke-width='4'/>";
 for(var k=1;k<=12;k++){var a=k*Math.PI/6;s+="<text x='"+(Math.sin(a)*43).toFixed(1)+"' y='"+(-Math.cos(a)*43+5).toFixed(1)+"' text-anchor='middle' font-size='13' font-weight='700' fill='#17375e' font-family='Fredoka,sans-serif'>"+k+"</text>";}
 for(var t=0;t<60;t++)s+="<line x1='0' y1='"+(t%5?-52:-49)+"' x2='0' y2='-55' stroke='#17375e' stroke-width='"+(t%5?1:2)+"' transform='rotate("+t*6+")'/>";
 return s+"<line x1='0' y1='0' x2='0' y2='-26' stroke='#ff7a59' stroke-width='6' stroke-linecap='round' transform='rotate("+((h%12+m/60)*30)+")'/><line x1='0' y1='0' x2='0' y2='-38' stroke='#17375e' stroke-width='4' stroke-linecap='round' transform='rotate("+(m*6)+")'/><circle r='4' fill='#17375e'/></svg>";
}
function gCount(){
 var mx=GR===0?(LV<=2?10:20):(LV<=2?10:LV<=4?20:30),n=rnd(2,mx),e=pick(ITEMS),v='',w='';
 for(var i=1;i<=n;i++){v+='<span>'+e+'</span>';w+="<span class='nb'>"+e+'<i>'+i+'</i></span>';}
 return{prompt:'How many do you see?',say:'Count them one by one!',vis:"<div class='stuff'>"+v+'</div>',ans:n,opts:near(n,[],35,1),txt:'Count the '+n+' items',speak:'How many do you see?',how:'Touch each one and say a number. The last number you say is the answer: '+n+'.',viz:"<div class='stuff'>"+w+'</div>'};
}
function gAdd(){
 var a,b,m;
 if(GR===0){m=LV<=2?5:10;a=rnd(1,m-1);b=rnd(1,m-a);}
 else if(GR===1){m=LV<=2?10:20;a=rnd(1,m-1);b=rnd(1,m-a);if(LV>=4){a=rnd(6,14);b=rnd(3,20-a);}}
 else if(LV<=2){a=rnd(1,8)*10+rnd(0,5);b=rnd(1,4);}
 else{a=rnd(10,70);b=rnd(10,99-a);}
 var s=a+b,q={a:a,b:b,isAdd:1,prompt:'Put them together!',say:'Count all of them.',ans:s,txt:a+' + '+b,speak:a+' plus '+b+'. What is the answer?',opts:near(s,[],GR===2?99:22,0)};
 q.vis=(s<=10?"<div class='grp'><div class='stuff'>"+items(a)+"</div><b style='font-size:2rem'>+</b><div class='stuff'>"+items(b)+'</div></div>':'')+eqv([a,'+',b,'=','?']);
 if(b<=10&&s<=20){q.how='Start at '+a+' and count on '+b+' more. You land on '+s+'.';q.viz=hops(a,b,1);}
 else{var ta=Math.floor(a/10),tb=Math.floor(b/10),oa=a%10,ob=b%10,T=(ta+tb)*10,O=oa+ob;
  q.how='Add the tens: '+ta*10+' plus '+tb*10+' is '+T+'. Add the ones: '+oa+' plus '+ob+' is '+O+'. Then '+T+' plus '+O+' is '+s+'. Each blue block is ten and each orange dot is one.';
  q.viz="<div class='stuff'>"+'🟦'.repeat(ta+tb)+' '+'🔸'.repeat(O)+'</div>';}
 return q;
}
function gSub(){
 var x,y,m;
 if(GR===0){m=LV<=2?5:10;x=rnd(2,m);y=rnd(1,x-1);}
 else if(GR===1){m=LV<=2?10:20;x=rnd(3,m);y=rnd(1,x-1);if(LV>=4){x=rnd(11,20);y=rnd(3,9);}}
 else{x=rnd(20,99);y=rnd(LV<=2?1:10,Math.min(LV<=2?9:60,x-1));}
 var r=x-y,q={x:x,y:y,prompt:'Take some away!',say:x<=10?'The faded ones are taken away.':'How many are left?',ans:r,txt:x+' − '+y,speak:x+' take away '+y+'. How many are left?',opts:near(r,[],GR===2?99:22,0)};
 q.vis=(x<=10?"<div class='stuff'>"+items(x,y)+'</div>':'')+eqv([x,'−',y,'=','?']);
 if(y<=10&&x<=20){q.how='Start at '+x+' and count back '+y+'. You land on '+r+'.';q.viz=hops(x,y,-1);}
 else{var ty=Math.floor(y/10),oy=y%10,s1=x-ty*10;
  q.how='Take away the tens first: '+x+' minus '+ty*10+' is '+s1+'. Then take away the ones: '+s1+' minus '+oy+' is '+r+'.';q.viz=chips([x,s1,r],[2]);}
 return q;

 app.innerHTML=h+"</div><p class='say' style='font-size:1rem'>Grown-ups can change the grade later.</p>";
 wire();
 Array.prototype.forEach.call(app.querySelectorAll('[data-g]'),function(b){b.onclick=function(){GR=parseInt(b.getAttribute('data-g'),10);hasGrade=true;try{localStorage.setItem('hop-grade',String(GR));}catch(e){}menu();};});
}
function menu(){
 var html=header()+"<div class='card hero'><span class='frog hop'>🐸</span><h1>Hop’s Math Pond</h1><div class='row' style='margin-top:12px'><button class='big alt sm' id='gr'>🎓 "+GN[GR]+"</button><button class='big alt sm' id='rp'>📋 Grown-up report</button></div></div><div class='menu'>";
 MODES.filter(function(m){return GM[m.id].indexOf(GR)>-1;}).forEach(function(m){html+="<button class='mode' data-m='"+m.id+"' style='background:"+m.c+"'><span class='e'>"+m.e+'</span><span>'+(GR>=3&&ONAME[m.id]?ONAME[m.id][0]:m.name)+'<small>'+(GR>=3&&ONAME[m.id]?ONAME[m.id][1]:m.desc)+'</small></span></button>';});
 html+="</div><div class='card hero'><h2>Choose Hop’s voice</h2><div class='row' style='margin-top:12px'><button class='big"+(voiceKind==='teacher'?'':' alt')+"' data-v='teacher'>👩‍🏫 Teacher</button><button class='big"+(voiceKind==='child'?'':' alt')+"' data-v='child'>🧒 Kid</button></div><p style='margin:14px 0 6px;font-weight:600'>More voices on this device</p><select id='vsel' class='sel' aria-label='Voice'></select><p style='margin:12px 0 6px;font-weight:600'>Speaking speed</p><select id='vspd' class='sel' aria-label='Speed'><option value='0.75'>Slow</option><option value='1'>Normal</option><option value='1.2'>Fast</option></select></div>";
 app.innerHTML=html;wire();
 var vsel=document.getElementById('vsel'),vspd=document.getElementById('vspd');
 function fillV(){try{var vs=speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang);}),cur=localStorage.getItem('hop-vname')||'';
  vsel.innerHTML='<option value="">Automatic</option>'+vs.map(function(v){var n=v.name.replace(/"/g,'&quot;');return '<option value="'+n+'"'+(v.name===cur?' selected':'')+'>'+v.name+' ('+v.lang+')</option>';}).join('');}catch(e){}}
 fillV();try{speechSynthesis.onvoiceschanged=fillV;}catch(e){}
 try{vspd.value=localStorage.getItem('hop-speed')||'1';}catch(e){}
 vsel.onchange=function(){try{localStorage.setItem('hop-vname',vsel.value);}catch(e){}speak('Hi! This is how I sound. Let’s do some math!');};
 vspd.onchange=function(){try{localStorage.setItem('hop-speed',vspd.value);}catch(e){}speak('Hi! This is how fast I talk.');};
 document.getElementById('gr').onclick=pickGrade;
 document.getElementById('rp').onclick=function(){report(false,menu);};
 Array.prototype.forEach.call(app.querySelectorAll('[data-v]'),function(b){b.onclick=function(){
  voiceKind=b.getAttribute('data-v');try{localStorage.setItem('hop-voice',voiceKind);}catch(e){}
  Array.prototype.forEach.call(app.querySelectorAll('[data-v]'),function(x){x.className='big'+(x===b?'':' alt');});
  speak(voiceKind==='child'?'Hi! Let’s hop and count together!':'Hello, friend! Let’s practice math together.');
 };});
 Array.prototype.forEach.call(app.querySelectorAll('.mode'),function(b){b.onclick=function(){play(b.getAttribute('data-m'));};});
}
function report(isDue,cont){
 var tot=ST.r+ST.w,acc=tot?Math.round(ST.r*100/tot):0,rows='',weak=[];
 MODES.forEach(function(m){var s=ST.m[m.id];if(!s)return;var n=s.r+s.w,p=Math.round(s.r*100/n);
  rows+="<div class='trow'><span>"+m.e+' '+m.name+'</span><span>✅ '+s.r+' ❌ '+s.w+"</span><span class='tb'><i style='width:"+p+'%;background:'+(p>=70?'var(--leaf)':'var(--bad)')+"'></i></span></div>";
  if(n>=3&&p<70)weak.push(m);});
 var tips=weak.length?weak.map(function(m){return '<p><b>'+m.name+':</b> '+TIPS[m.id]+'</p>';}).join(''):'<p>No weak spots yet. Keep practicing!</p>';
 var miss=ST.miss.slice(-8).map(function(x){return '<li>'+x.txt+' → <b>'+x.ans+'</b> <small>(chose '+x.got+')</small></li>';}).join('')||'<li>None 🎉</li>';
 app.innerHTML=header()+"<div class='card rep'><h2>📋 "+(isDue?'Grown-up check-in: '+total+' stars!':'Progress so far')+"</h2><p>"+(tot?'Here is how your child did since the last report.':'No questions answered yet.')+"</p><div class='stat'><div><b>✅ "+ST.r+'</b>right</div><div><b>❌ '+ST.w+'</b>wrong</div><div><b>'+acc+'%</b>correct</div></div>'+
  '<h2 style="margin-top:14px">By topic</h2>'+(rows||'<p>Play a game to see topics.</p>')+'<h2 style="margin-top:14px">Practice more</h2>'+tips+'<h2 style="margin-top:14px">Recent misses</h2><ul>'+miss+"</ul></div><div class='row'><button class='big' id='rd'>"+(isDue?'Done, start next 25 ⭐':'Back')+'</button></div>';
 wire();
 document.getElementById('rd').onclick=function(){if(isDue){ST={r:0,w:0,m:{},miss:[]};saveST();}cont();};
}
function play(mode){
 var N=10,i=0,score=0,streak=0,miss=0,res=[],q,padImg=null;
 LV=lvls[GR+mode]||1;
 function show(){
  q=mkQ(mode);padImg=null;
  var pads='',k;for(k=0;k<N;k++)pads+='<span class="pad '+(k<i?(res[k]?'done':'bad'):k===i?'now':'')+'"></span>';
  var a='',fl=Math.max.apply(null,q.opts.map(function(o){return String(o).length;})),fs=q.sm?'1.8rem':fl>=8?'1.15rem':fl>=6?'1.4rem':fl>=5?'1.9rem':'';q.opts.forEach(function(o){a+='<button class="ans" data-v="'+o+'"'+(fs?' style="font-size:'+fs+'"':'')+'>'+o+'</button>';});
  app.innerHTML=header()+'<div style="text-align:center;font-weight:700;font-size:1.1rem">'+GN[GR]+' · Level '+LV+' of 5</div><div class="pads" aria-label="Question '+(i+1)+' of '+N+'">'+pads+'</div>'+
   '<div class="card q"><span class="frog" id="frog">🐸</span><div class="prompt">'+q.prompt+'</div>'+q.vis+'<div class="row" style="gap:8px"><button class="big alt" id="hear" style="font-size:1rem;padding:8px 14px">🔊 Hear it</button><button class="big alt" id="scr" style="font-size:1rem;padding:8px 14px">✏️ Scratch paper</button></div></div>'+
   '<div class="say" id="say" aria-live="polite">'+q.say+'</div><div class="answers" style="'+(q.two?'grid-template-columns:repeat(2,1fr)':'')+'">'+a+'</div><div id="ls"></div>';
  wire();
  document.getElementById('hear').onclick=function(){say2(q.speak);};
  document.getElementById('scr').onclick=openPad;
  Array.prototype.forEach.call(app.querySelectorAll('.ans'),function(b){b.onclick=function(){check(b);};});
  setTimeout(function(){say2(q.speak);},250);
 }
 function openPad(){
  var o=document.createElement('div');o.className='padov';
  o.innerHTML="<div class='padtop'><b>"+q.prompt+"</b>"+q.vis+"</div><canvas id='cv' aria-label='Scratch paper'></canvas><div class='padtools'><button data-c='#17375e' class='sw on' style='background:#17375e' aria-label='Navy pen'></button><button data-c='#e5484d' class='sw' style='background:#e5484d' aria-label='Red pen'></button><button data-c='#2f9e5b' class='sw' style='background:#2f9e5b' aria-label='Green pen'></button><button data-c='#2f6fe4' class='sw' style='background:#2f6fe4' aria-label='Blue pen'></button><button id='er' class='tl'>🧽</button><button id='cl' class='tl'>🗑️</button><button id='bk' class='big' style='font-size:1.1rem;padding:10px 18px'>✅ Back</button></div>";
  document.body.appendChild(o);document.body.style.overflow='hidden';
  var cv=o.querySelector('canvas'),cx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,col='#17375e',er=false,dn=false,lx=0,ly=0;
  function setup(){var r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;cx.setTransform(dpr,0,0,dpr,0,0);cx.lineCap='round';cx.lineJoin='round';
   if(padImg){var im=new Image();im.onload=function(){cx.save();cx.globalCompositeOperation='source-over';cx.drawImage(im,0,0,r.width,r.height);cx.restore();};im.src=padImg;}}
  requestAnimationFrame(setup);
  function style(){cx.globalCompositeOperation=er?'destination-out':'source-over';cx.strokeStyle=cx.fillStyle=col;cx.lineWidth=er?24:4;}
  cv.style.touchAction='none';
  cv.onpointerdown=function(e){e.preventDefault();dn=true;var r=cv.getBoundingClientRect();lx=e.clientX-r.left;ly=e.clientY-r.top;try{cv.setPointerCapture(e.pointerId);}catch(x){}style();cx.beginPath();cx.arc(lx,ly,cx.lineWidth/2,0,6.3);cx.fill();};
  cv.onpointermove=function(e){if(!dn)return;var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;style();cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(x,y);cx.stroke();lx=x;ly=y;};
  cv.onpointerup=cv.onpointercancel=function(){dn=false;};
  Array.prototype.forEach.call(o.querySelectorAll('.sw'),function(b){b.onclick=function(){col=b.getAttribute('data-c');er=false;Array.prototype.forEach.call(o.querySelectorAll('.sw'),function(x){x.classList.remove('on');});b.classList.add('on');document.getElementById('er').classList.remove('on');};});
  document.getElementById('er').onclick=function(){er=!er;this.classList.toggle('on',er);};
  document.getElementById('cl').onclick=function(){cx.save();cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.restore();padImg=null;};
  document.getElementById('bk').onclick=function(){try{padImg=cv.toDataURL();}catch(e){}o.remove();document.body.style.overflow='';};
 }
 function nextQ(){i++;if(i>=N)end();else show();}
 function check(b){
  var v=b.getAttribute('data-v'),ok=v===String(q.ans),say=document.getElementById('say');
  Array.prototype.forEach.call(app.querySelectorAll('.ans'),function(x){x.disabled=true;if(x.getAttribute('data-v')===String(q.ans))x.classList.add('ok');});
  ST.m[mode]=ST.m[mode]||{r:0,w:0};
  if(ok){
   ST.r++;ST.m[mode].r++;total++;save();res.push(1);score++;streak++;miss=0;
   var msg='';if(streak>=2&&LV<5){LV++;streak=0;msg=' Level up! ⬆️';}
   document.getElementById('frog').classList.add('hop');
   say.textContent=pick(['Great job!','You got it!','Hop hop hooray!','Super!','Awesome!'])+msg;
   beep([523,659,784]);document.querySelector('.pill').textContent='⭐ '+total;
   if(total%25===0)due=true;
   setTimeout(nextQ,1100);
  }else{
   ST.w++;ST.m[mode].w++;ST.miss.push({txt:q.txt,ans:q.ans,got:v});if(ST.miss.length>40)ST.miss.shift();
   res.push(0);streak=0;miss++;if(miss>=2&&LV>1){LV--;miss=0;}
   b.classList.add('no');say.textContent='Not quite. Let’s learn!';beep([220],'triangle');
   var ls=document.getElementById('ls');
   ls.innerHTML="<div class='card lesson'><h2>🐸 Let’s learn!</h2><p>The answer is <b>"+q.ans+'</b>.</p><p>'+q.how+'</p>'+q.viz+"<div class='row'><button class='big alt' id='hl'>🔊 Hear it</button><button class='big' id='nx'>Next ➜</button></div></div>";
   document.getElementById('hl').onclick=function(){say2('The answer is '+q.ans+'. '+q.how);};
   document.getElementById('nx').onclick=nextQ;
   ls.scrollIntoView({behavior:'smooth',block:'center'});
   say2('The answer is '+q.ans+'. '+q.how);
  }
  lvls[GR+mode]=LV;try{localStorage.setItem('hop-lv',JSON.stringify(lvls));}catch(e){}
  saveST();
 }
 function summary(){
  var st=score>=9?3:score>=6?2:1,s='';
  for(var k=0;k<3;k++)s+=k<st?'⭐':'☆';
  confetti();beep([523,659,784,1047]);
  app.innerHTML=header()+'<div class="card hero"><span class="frog hop">🐸</span><h2 style="margin-top:8px">Hop made it across!</h2><div class="stars">'+s+'</div><p style="font-size:1.4rem;font-weight:600">'+score+' out of '+N+' right</p></div><div class="row"><button class="big" id="again">Play again</button><button class="big alt" id="menu">More games</button></div>';
  wire();
  document.getElementById('again').onclick=function(){play(mode);};
  document.getElementById('menu').onclick=menu;
 }
 function end(){if(due){due=false;report(true,summary);}else summary();}
 show();
}
if(hasGrade)menu();else pickGrade();
})();
</script>
</body>
</html>
